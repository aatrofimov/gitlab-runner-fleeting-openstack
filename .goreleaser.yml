version: 2

builds:
  - env:
      - CGO_ENABLED=0
    goos:
      - linux
    goarch:
      - amd64
      - arm64
    main: .
    binary: gitlab-runner-fleeting-openstack
    ldflags:
      - -s -w
      - -X github.com/aatrofimov/gitlab-runner-fleeting-openstack/internal/plugin.VERSION={{.Version}}
      - -X github.com/aatrofimov/gitlab-runner-fleeting-openstack/internal/plugin.REVISION={{.ShortCommit}}
      - -X github.com/aatrofimov/gitlab-runner-fleeting-openstack/internal/plugin.REFERENCE={{.FullCommit}}
      - -X github.com/aatrofimov/gitlab-runner-fleeting-openstack/internal/plugin.BUILT={{.Date}}

archives:
  - formats: [tar.gz]

checksum:
  name_template: checksums.txt
