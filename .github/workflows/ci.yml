name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  lint-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: golangci-lint
        uses: golangci/golangci-lint-action@v9
        with:
          # Pin a v2 release built with go >= 1.26: `latest` on older action
          # versions resolved to v1.64.8 (go1.24), which cannot lint a go 1.26 module.
          version: v2.14.0

      - name: go vet
        run: go vet ./...

      - name: go test
        run: go test ./...
