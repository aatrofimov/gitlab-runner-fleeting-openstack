name: Packer

# Checks the image template on PRs (syntax + plugin resolution). The openstack
# plugin authenticates during `packer validate`, so the full validate/build needs
# a live cloud and is run locally (see docs/image-building.md).
on:
  pull_request:
    paths:
      - 'packer/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-packer@v3
        with:
          version: latest

      - name: packer init
        working-directory: packer
        run: packer init .

      - name: packer fmt check
        working-directory: packer
        run: packer fmt -check .
